server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow multi-year DKB CSV bank statement uploads
    client_max_body_size 15m;

    # Gzip compression for fast ERP table & PWA delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Hardened response headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse-proxy FastAPI REST endpoints & preserve Pangolin / Newt Forward-Auth headers
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        proxy_set_header X-Forwarded-Groups $http_x_forwarded_groups;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_read_timeout 60s;
    }

    # Reverse-proxy FastAPI Liveness & Readiness probes
    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Never cache PWA service worker, manifest, or HTML shell so updates apply immediately
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js|index\.html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Long-term immutable cache for content-hashed Vite bundles
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA client-side routing fallback
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
